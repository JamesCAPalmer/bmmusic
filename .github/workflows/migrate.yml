name: Apply migrations

# Applies pending D1 migrations to the live `minster-data` after a merge to
# main.
#
# **Why this exists.** Cloudflare Workers Builds deploys the code by itself on
# every merge. Nothing applied the migrations, so that was a manual step — and
# on 27 August 2026 it was missed for long enough that the whole choir side
# returned 500 on every page, because `authMiddleware` reads `app_setting`
# before it does anything else and the table was not there yet. A step that has
# to be remembered, by somebody who works through a GUI and has never opened a
# terminal, is a step that will be missed again.
#
# **Why it is safe to run automatically.** A migration cannot reach main
# without passing the PR checks, which include applying `migrations/` to a real
# SQLite database and running the schema tests over it. `wrangler d1 migrations
# apply` is a no-op when nothing is pending, so this running on every merge
# costs a few seconds and nothing else.
#
# **What it is not.** It does not deploy — Workers Builds does that. It does not
# touch R2. It reads and writes exactly one D1 database.

on:
  push:
    branches: [main]
    # No path filter on purpose. Filtering to `migrations/**` would mean a run
    # that failed for a transient reason is never retried, because the next
    # merge would not touch a migration file. Running always is cheap and
    # self-healing.
  workflow_dispatch:

# The token can write to the live database, so nothing here needs the
# repository itself beyond reading the migration files.
permissions:
  contents: read

# Two merges in quick succession must not race each other into the same
# database. `cancel-in-progress: false` because a half-finished migration run
# is worse than a queued one.
concurrency:
  group: d1-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations to minster-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # A clear failure beats a confusing one. Without this the wrangler error
      # is an opaque "Authentication error [code: 10000]".
      - name: Check the credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set as a repository secret."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set as a repository secret."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::Migrations were NOT applied. See docs/DEPLOY.md — the token needs Account → D1 → Edit."
            exit 1
          fi

      - name: What is pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list minster-data --remote

      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply minster-data --remote

      # The check that would have caught the outage. `app_setting` is read by
      # the auth middleware on every gated request, so if it is missing the
      # whole app is down — and this is the cheapest possible way to know.
      - name: Prove the schema is there
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute minster-data --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" \
            > tables.json
          for t in app_setting person service duty rate parent_contact import_batch; do
            if ! grep -q "\"$t\"" tables.json; then
              echo "::error::Table '$t' is missing after applying migrations. The app will 500 on every gated page."
              exit 1
            fi
          done
          echo "All expected tables present."

      - name: Summary
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "### Migrations on \`minster-data\`"
            echo
            npx wrangler d1 migrations list minster-data --remote 2>&1 \
              | sed 's/^/    /' || echo "    (could not list — see the step above)"
          } >> "$GITHUB_STEP_SUMMARY"
